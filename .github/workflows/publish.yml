name: Publish image
# Pushes a multi-arch image to Docker Hub: angelxmoreno/last30days-api
#   push to main  -> :edge
#   tag vX.Y.Z    -> :X.Y.Z, :X.Y, :X, :latest
# Needs repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (read/write access token).
# Without them the job skips with a notice instead of failing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: docker.io/angelxmoreno/last30days-api

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Docker Hub secrets
        id: creds
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$USER" && -n "$TOKEN" ]]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set; skipping publish"; fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: docker/setup-qemu-action@v3
        if: steps.creds.outputs.ok == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.ok == 'true'
      - uses: docker/login-action@v3
        if: steps.creds.outputs.ok == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        if: steps.creds.outputs.ok == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
      - uses: docker/build-push-action@v6
        if: steps.creds.outputs.ok == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
